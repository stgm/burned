apiVersion: apps/v1
kind: Deployment
metadata:
  name: rounds
  namespace: "{{ .Release.Namespace }}"
spec:
  selector:
    matchLabels:
      app: rounds
  replicas: 1
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        app: rounds
        {{- if .Values.azure }}
        aadpodidbinding: rounds-azure-kv
        {{- end }}
    spec:
      containers:
        - name: rounds
          image: "{{ .Values.image }}:{{ .Values.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 2300
          env:
            - name: HANAMI_ENV
              value: production
            - name: APP_URL
              value: "https://{{ .Values.hostname }}"
            - name: MAIL_FROM
              value: "{{ .Values.mail.from }}"
            - name: SMTP_ADDRESS
              value: "{{ .Values.mail.address }}"
            - name: SMTP_PORT
              value: "{{ .Values.mail.port }}"
            - name: SMTP_DOMAIN
              value: "{{ .Values.mail.domain }}"
            - name: DATABASE_HOST
              value: "{{ .Values.database.host }}"
            - name: DATABASE_NAME
              value: "{{ .Values.database.name }}"
            - name: DATABASE_USER
              value: "{{ .Values.database.user }}"
            {{- if .Values.admin.email }}
            - name: ADMIN_EMAIL
              value: "{{ .Values.admin.email }}"
            {{- end }}
          envFrom:
            - secretRef:
                name: rounds-secret
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/etc/secrets"
              readOnly: true

      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "rounds-secretproviderclass"
